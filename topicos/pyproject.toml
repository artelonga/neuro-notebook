[project]
name = "topicos"
version = "0.1.0"
description = "Topic modeling and term network for the neuro-notebook review base"
requires-python = ">=3.12,<3.14"
dependencies = [
    "bertopic>=0.16",
    "sentence-transformers>=3.0",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.38",
    "pacmap>=0.7",
    "scikit-learn>=1.5",
    "networkx>=3.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "kaleido>=1.0",
    "anthropic>=0.70",
]

[tool.uv]
package = false
