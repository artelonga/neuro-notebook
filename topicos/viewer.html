<title>Grafo de Termos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-height graph canvas (the "vault graph") with a docked inspector; stacks on phones. */
:root {
  --bg: #f3f4f1; --panel: #ffffff; --line: #d9dcd4; --fg: #1d2127; --muted: #5d6570; --faint: #8a919a;
  --edge: rgba(40, 48, 60, 0.16); --edge-hi: rgba(40, 48, 60, 0.55); --node-dim: rgba(120, 128, 138, 0.22);
  --accent: #2a78d6; --chip: #eceee9;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --other: #a3a9b0;
  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1c1f; --panel: #232428; --line: #34363c; --fg: #e8e6e1; --muted: #a9adb4; --faint: #7d828a;
  --edge: rgba(200, 205, 215, 0.13); --edge-hi: rgba(220, 225, 235, 0.55); --node-dim: rgba(140, 146, 156, 0.2);
  --accent: #3987e5; --chip: #2c2e33;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  --other: #6b7079; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1b1c1f; --panel: #232428; --line: #34363c; --fg: #e8e6e1; --muted: #a9adb4; --faint: #7d828a;
  --edge: rgba(200, 205, 215, 0.13); --edge-hi: rgba(220, 225, 235, 0.55); --node-dim: rgba(140, 146, 156, 0.2);
  --accent: #3987e5; --chip: #2c2e33;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  --other: #6b7079; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto minmax(0, 1fr); }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0.01em; }
.stats { color: var(--muted); font: 12px var(--mono); font-variant-numeric: tabular-nums; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-left: auto; }
label.ctl { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
input[type="search"], select { font: 13px var(--sans); color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; }
input[type="search"] { width: 200px; }
input[type="range"] { width: 90px; accent-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.stage { position: relative; min-width: 0; min-height: 0; }
canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
canvas.hovering { cursor: pointer; }
.legend { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px;
  max-width: calc(100% - 24px); }
.chip { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; padding: 4px 9px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line); color: var(--fg); cursor: pointer; }
.chip[aria-pressed="false"] { opacity: 0.45; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
aside { border-left: 1px solid var(--line); background: var(--panel); min-height: 0; display: flex; flex-direction: column; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; font: 500 13px var(--sans); color: var(--muted); background: none; border: 0; padding: 10px; cursor: pointer;
  border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.pane { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.pane h2 { margin: 0; font-size: 20px; font-weight: 600; text-wrap: balance; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; font-variant-numeric: tabular-nums; }
.sec { font: 600 11px var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.list li { font-size: 13px; }
.linkbtn { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.small { color: var(--faint); font-size: 12px; }
.path { font: 12px var(--mono); color: var(--muted); user-select: all; word-break: break-all; }
.topic { display: flex; flex-direction: column; gap: 3px; padding: 10px 0; border-top: 1px solid var(--line); }
.topic:first-child { border-top: 0; }
.empty { color: var(--muted); }
a { color: var(--accent); }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 60vh auto; height: auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .controls { margin-left: 0; }
  input[type="search"] { width: 150px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <h1>Grafo de termos</h1>
    <span class="stats" id="stats">carregando…</span>
    <div class="controls">
      <input type="search" id="q" placeholder="Buscar termo" aria-label="Buscar termo">
      <label class="ctl" for="colorBy">Cor
        <select id="colorBy">
          <option value="theme">Tema</option>
          <option value="community">Comunidade</option>
          <option value="trend">Tendência</option>
          <option value="source">Fonte</option>
        </select>
      </label>
      <label class="ctl" for="minDocs">Mín. trabalhos <input type="range" id="minDocs" min="4" max="40" value="4"> <span id="minDocsV" class="stats">4</span></label>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Grafo de termos: nós são termos, arestas ligam termos que aparecem juntos nos mesmos trabalhos"></canvas>
    <div class="legend" id="legend"></div>
  </div>
  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabTerm" aria-selected="true">Termo</button>
      <button role="tab" id="tabTopics" aria-selected="false">Tópicos</button>
      <button role="tab" id="tabAbout" aria-selected="false">Como ler</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(() => {
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), stage = document.getElementById("stage");
  const pane = document.getElementById("pane"), legend = document.getElementById("legend");
  const $ = id => document.getElementById(id);
  let data, nodes, links, byId, adj, topics, transform = d3.zoomIdentity, hover = null, selected = null;
  let colorBy = "theme", minDocs = 4, query = "", hidden = new Set(), tab = "term", W = 0, H = 0, dpr = 1;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const PAL = () => [1, 2, 3, 4, 5, 6, 7, 8].map(i => css("--c" + i));
  const TREND = ["emergente", "estável", "em queda"], SOURCE = ["palavra-chave", "texto", "ambos"];
  const noteName = s => s.replace(/[\\/:*?"<>|#^\[\]]/g, "-").replace(/^[ .-]+|[ .-]+$/g, "").slice(0, 120);
  const fmt = n => n.toLocaleString("pt-BR");

  function category(d) {
    if (colorBy === "theme") return d.theme;
    if (colorBy === "community") return d.community < 8 ? d.community + 1 : 0;
    if (colorBy === "trend") return { "emergente": 2, "estável": 0, "em queda": 1 }[d.trend];
    return { "palavra-chave": 1, "texto": 2, "ambos": 3 }[d.source];
  }
  function colorOf(cat) { return cat >= 1 && cat <= 8 ? PAL()[cat - 1] : css("--other"); }
  function categories() {
    if (colorBy === "theme") {
      const seen = new Map();
      data.topics.forEach(t => { if (!seen.has(t.theme)) seen.set(t.theme, t.theme_label); });
      return [...seen].sort((a, b) => a[0] - b[0]).map(([k, l]) => ({ k, label: `Tema ${k} · ${l}` }));
    }
    if (colorBy === "community") {
      const n = new Set(nodes.map(d => d.community)).size;
      return [...Array(Math.min(8, n)).keys()].map(i => ({ k: i + 1, label: `Comunidade ${i}` }))
        .concat(n > 8 ? [{ k: 0, label: `Outras (${n - 8})` }] : []);
    }
    if (colorBy === "trend") return [{ k: 2, label: "Emergente" }, { k: 0, label: "Estável" }, { k: 1, label: "Em queda" }];
    return [{ k: 1, label: "Palavra-chave" }, { k: 2, label: "Texto" }, { k: 3, label: "Ambos" }];
  }
  const visible = d => d.docs >= minDocs && !hidden.has(category(d));
  const radius = d => 2.5 + Math.sqrt(d.docs) * 1.6;

  function resize() {
    const r = stage.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1; W = r.width; H = r.height;
    cv.width = W * dpr; cv.height = H * dpr;
    draw();
  }

  function draw() {
    if (!nodes) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(transform.x, transform.y);
    ctx.scale(transform.k, transform.k);
    const focus = hover || selected;
    const near = focus ? adj.get(focus.term) : null;
    const match = query ? new Set(nodes.filter(d => d.label.toLowerCase().includes(query)).map(d => d.term)) : null;
    const lit = d => (!focus || d === focus || near.has(d.term)) && (!match || match.has(d.term));
    ctx.lineWidth = 1 / transform.k;
    for (const l of links) {
      if (!visible(l.source) || !visible(l.target)) continue;
      const on = focus && (l.source === focus || l.target === focus);
      ctx.strokeStyle = on ? css("--edge-hi") : css("--edge");
      if (focus && !on) continue;
      ctx.beginPath(); ctx.moveTo(l.source.x, l.source.y); ctx.lineTo(l.target.x, l.target.y); ctx.stroke();
    }
    const dim = css("--node-dim");
    for (const d of nodes) {
      if (!visible(d)) continue;
      ctx.beginPath(); ctx.arc(d.x, d.y, radius(d), 0, 2 * Math.PI);
      ctx.fillStyle = lit(d) ? colorOf(category(d)) : dim;
      ctx.fill();
      if (d === selected) { ctx.lineWidth = 2 / transform.k; ctx.strokeStyle = css("--fg"); ctx.stroke(); }
    }
    // labels: big terms always, more as you zoom in, neighbours of the focus always
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    const fs = 11 / transform.k;
    ctx.font = `500 ${fs}px ${css("--sans")}`;
    const minLabel = transform.k > 2.2 ? 0 : transform.k > 1.3 ? 10 : 22;
    for (const d of nodes) {
      if (!visible(d)) continue;
      const show = (focus && lit(d)) || (match && match.has(d.term)) || (!focus && !match && d.docs >= minLabel);
      if (!show) continue;
      ctx.fillStyle = css("--fg");
      ctx.globalAlpha = lit(d) ? 0.92 : 0.3;
      ctx.fillText(d.label, d.x, d.y + radius(d) + 2 / transform.k);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function nodeAt(px, py) {
    const [x, y] = transform.invert([px, py]);
    let best = null, bd = Infinity;
    for (const d of nodes) {
      if (!visible(d)) continue;
      const dd = Math.hypot(d.x - x, d.y - y);
      if (dd < radius(d) + 4 / transform.k && dd < bd) { best = d; bd = dd; }
    }
    return best;
  }

  function renderLegend() {
    legend.innerHTML = "";
    for (const c of categories()) {
      const b = document.createElement("button");
      b.className = "chip"; b.type = "button";
      b.setAttribute("aria-pressed", hidden.has(c.k) ? "false" : "true");
      b.innerHTML = `<span class="dot" style="background:${colorOf(c.k)}"></span>`;
      b.append(c.label);
      b.title = "Mostrar ou esconder";
      b.onclick = () => { hidden.has(c.k) ? hidden.delete(c.k) : hidden.add(c.k); renderLegend(); draw(); };
      legend.append(b);
    }
  }

  function setTab(t) {
    tab = t;
    ["Term", "Topics", "About"].forEach(n => $("tab" + n).setAttribute("aria-selected", String(t === n.toLowerCase())));
    renderPane();
  }
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function renderPane() {
    if (tab === "topics") {
      const byTheme = d3.group(data.topics, t => t.theme);
      pane.innerHTML = [...byTheme].sort((a, b) => a[0] - b[0]).map(([th, ts]) =>
        `<div class="sec" style="display:flex;gap:6px;align-items:center"><span class="dot" style="background:${colorOf(th)}"></span>Tema ${th} · ${esc(ts[0].theme_label)}</div>` +
        ts.map(t => `<div class="topic"><button class="linkbtn" data-topic="${t.topic}">T${String(t.topic).padStart(2, "0")} · ${esc(t.label)}</button>
          <span class="small">${fmt(t.n_docs)} trabalhos · NPMI ${t.npmi.toFixed(2).replace(".", ",")} · ano mediano ${t.median_year} · ${Math.round(t.share_opto_keyword * 100)}% com a palavra-chave optogenética</span>
          ${t.description ? `<span class="small">${esc(t.description)}</span>` : ""}
          <span class="small">Frases: ${esc(t.top_words.replaceAll(";", ","))}</span></div>`).join("")).join("");
      pane.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => {
        const t = +b.dataset.topic;
        const top = nodes.filter(d => d.topic === t).sort((a, b) => b.docs - a.docs)[0];
        if (top) { select(top); setTab("term"); }
      });
      return;
    }
    if (tab === "about") {
      pane.innerHTML = `<h2>Como ler o grafo</h2>
        <p>Cada <b>nó</b> é um termo: uma palavra-chave dos trabalhos ou uma expressão extraída do título e do resumo. O tamanho cresce com o número de trabalhos em que aparece.</p>
        <p>Cada <b>aresta</b> liga dois termos que aparecem juntos em vários trabalhos mais do que o acaso explicaria (NPMI ≥ ${data.params.min_npmi}, em ≥ ${data.params.min_co} trabalhos). Cada termo guarda só as ${data.params.top_k} ligações mais fortes.</p>
        <p>A <b>cor</b> mostra o tema do tópico dominante do termo (BERTopic), a comunidade do grafo (Louvain), a tendência ao longo do tempo ou a origem do termo. Clique na legenda para esconder grupos.</p>
        <p>Optogenética, Alzheimer e Parkinson ficam de fora: estão em todos os trabalhos.</p>
        <p>Os nomes dos tópicos foram dados por um modelo de linguagem local a partir das palavras distintivas e dos títulos representativos; os marcados como revisados foram conferidos à mão.</p>
        <p class="small">Fonte: data/topicos/graph.json · gerado por topicos/graph.py · embeddings ${esc(data.params.embedding)}</p>`;
      return;
    }
    const d = selected;
    if (!d) { pane.innerHTML = `<p class="empty">Clique num termo do grafo, ou busque um termo acima, para ver o tópico, os termos ligados e os trabalhos.</p>`; return; }
    const t = topics.get(d.topic);
    const nb = [...adj.get(d.term)].map(id => byId.get(id)).sort((a, b) => b.docs - a.docs);
    const works = d.work_ids.map(w => data.docs[w]).filter(Boolean).sort((a, b) => (b.year || 0) - (a.year || 0));
    pane.innerHTML = `<h2>${esc(d.label)}</h2>
      <dl class="meta">
        <dt>Trabalhos</dt><dd>${fmt(d.docs)}</dd>
        <dt>Tópico</dt><dd>T${String(d.topic).padStart(2, "0")} · ${esc(t.label)} (${Math.round(d.topic_purity * 100)}% dos trabalhos)</dd>
        <dt>Tema</dt><dd>${d.theme} · ${esc(t.theme_label)}</dd>
        <dt>Comunidade</dt><dd>${d.community}</dd>
        <dt>Tendência</dt><dd>${esc(d.trend)}</dd>
        <dt>Fonte</dt><dd>${esc(d.source)}</dd>
      </dl>
      <div class="sec">Nota no vault</div><div class="path">grafo/termos/${esc(noteName(d.label))}.md</div>
      <div class="sec">Termos ligados (${nb.length})</div>
      <ul class="list">${nb.map(n => `<li><button class="linkbtn" data-term="${esc(n.term)}">${esc(n.label)}</button> <span class="small">${fmt(n.docs)}</span></li>`).join("")}</ul>
      <div class="sec">Trabalhos (${works.length}${d.docs > works.length ? ` de ${fmt(d.docs)}` : ""})</div>
      <ul class="list">${works.map(w => `<li>${w.doi ? `<a href="https://doi.org/${esc(w.doi)}" target="_blank" rel="noopener">${esc(w.title)}</a>` : esc(w.title)}
        <span class="small">${esc(w.year || "s/d")}${w.journal ? " · " + esc(w.journal) : ""}${w.included ? " · seleção final" : ""}</span></li>`).join("")}</ul>`;
    pane.querySelectorAll("[data-term]").forEach(b => b.onclick = () => select(byId.get(b.dataset.term), true));
  }

  function select(d, center) {
    selected = d;
    if (d && center) {
      const k = Math.max(transform.k, 1.6);
      d3.select(cv).transition().duration(450).call(zoom.transform, d3.zoomIdentity.translate(W / 2 - d.x * k, H / 2 - d.y * k).scale(k));
    }
    renderPane(); draw();
  }

  const zoom = d3.zoom().scaleExtent([0.15, 8]).on("zoom", e => { transform = e.transform; draw(); });

  function init(g) {
    data = g;
    nodes = g.nodes.map(d => ({ ...d }));
    byId = new Map(nodes.map(d => [d.term, d]));
    links = g.links.map(l => ({ ...l }));
    adj = new Map(nodes.map(d => [d.term, new Set()]));
    links.forEach(l => { adj.get(l.source).add(l.target); adj.get(l.target).add(l.source); });
    topics = new Map(g.topics.map(t => [t.topic, t]));
    const sim = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id(d => d.term).distance(l => 26 + (1 - l.npmi) * 50).strength(l => 0.15 + l.npmi * 0.5))
      .force("charge", d3.forceManyBody().strength(-34).distanceMax(400))
      .force("x", d3.forceX(0).strength(0.04)).force("y", d3.forceY(0).strength(0.04))
      .force("collide", d3.forceCollide(d => radius(d) + 1.5))
      .stop();
    for (let i = 0; i < 360; i++) sim.tick();
    resize();
    const xs = d3.extent(nodes, d => d.x), ys = d3.extent(nodes, d => d.y);
    const k = 0.92 * Math.min(W / (xs[1] - xs[0] + 40), H / (ys[1] - ys[0] + 40));
    d3.select(cv).call(zoom).call(zoom.transform, d3.zoomIdentity.translate(W / 2 - k * (xs[0] + xs[1]) / 2, H / 2 - k * (ys[0] + ys[1]) / 2).scale(k));
    $("stats").textContent = `${fmt(nodes.length)} termos · ${fmt(links.length)} ligações · ${fmt(g.topics.length)} tópicos · ${fmt(Object.keys(g.docs).length)} trabalhos`;
    $("minDocs").max = String(Math.min(60, d3.max(nodes, d => d.docs)));
    renderLegend(); renderPane();
  }

  cv.addEventListener("pointermove", e => {
    const r = cv.getBoundingClientRect(), d = nodeAt(e.clientX - r.left, e.clientY - r.top);
    if (d !== hover) { hover = d; cv.classList.toggle("hovering", !!d); draw(); }
  });
  cv.addEventListener("pointerleave", () => { hover = null; draw(); });
  cv.addEventListener("click", e => {
    const r = cv.getBoundingClientRect();
    const d = nodeAt(e.clientX - r.left, e.clientY - r.top);
    select(d); if (d) setTab("term");
  });
  $("q").addEventListener("input", e => {
    query = e.target.value.trim().toLowerCase(); draw();
  });
  $("q").addEventListener("keydown", e => {
    if (e.key !== "Enter" || !query) return;
    const hit = nodes.filter(d => visible(d) && d.label.toLowerCase().includes(query)).sort((a, b) => b.docs - a.docs)[0];
    if (hit) { select(hit, true); setTab("term"); }
  });
  $("colorBy").addEventListener("change", e => { colorBy = e.target.value; hidden.clear(); renderLegend(); draw(); });
  $("minDocs").addEventListener("input", e => { minDocs = +e.target.value; $("minDocsV").textContent = e.target.value; draw(); });
  $("tabTerm").onclick = () => setTab("term");
  $("tabTopics").onclick = () => setTab("topics");
  $("tabAbout").onclick = () => setTab("about");
  new ResizeObserver(resize).observe(stage);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { renderLegend(); draw(); });
  new MutationObserver(() => { renderLegend(); draw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  fetch("graph.json").then(r => {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(init).catch(() => {
    $("stats").textContent = "Não foi possível carregar graph.json. Publique-o ao lado desta página.";
  });
})();
</script>
